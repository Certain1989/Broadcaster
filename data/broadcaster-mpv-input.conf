#
# Local to Broadcaster's managed mpv process. The user's input.conf is untouched.
ESC quit
BS quit
# Wayland XF86Back appears as GO_BACK in mpv input.conf.
GO_BACK quit
STOP quit
PLAYPAUSE cycle pause
PLAY set pause no
PAUSE set pause yes
LEFT seek -10
RIGHT seek 10
UP seek 60
DOWN seek -60
