# Temporary locked-dependency resolver, removed before PR review.
name: Validate zbus 6 transition

on:
  push:
    branches: [maintenance/zbus6-upgrade]
    paths: [.github/workflows/resolve-zbus6.yml]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'Certain1989/Broadcaster' && github.ref == 'refs/heads/maintenance/zbus6-upgrade'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install native and Rust dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust cargo-audit gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Resolve zbus 6 and inspect retired packages
        run: |
          cargo update
          cargo tree --locked -i zbus
          if cargo tree --locked -i zvariant; then
            echo "::warning::Old zvariant still used; inspect reverse dependency tree"
          fi
          cargo fmt
          cargo fmt --check
      - name: Test new D-Bus API
        run: |
          meson setup _build -Dprofile=development
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          meson compile -C _build
          meson test -C _build --print-errorlogs
      - name: RustSec audit
        run: cargo audit
      - name: Commit compiled dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Certain1989/Broadcaster
          test "$GITHUB_REF" = refs/heads/maintenance/zbus6-upgrade
          cd "$GITHUB_WORKSPACE"
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" config user.name 'github-actions[bot]'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" add -- Cargo.lock src/launcher/application_proxy.rs src/application.rs src/launcher/mod.rs
          if git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" diff --cached --quiet; then
            exit 0
          fi
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" commit -m 'build: lock tested zbus 6 dependencies'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" push origin HEAD:refs/heads/maintenance/zbus6-upgrade
