# Temporary read-only dependency resolution for the I1 development branch.
name: I1 Resolve Rust graph (temporary)
on:
  push:
    branches:
      - work/post031-d1-i1-rust-sqlite-20261105
    paths:
      - .github/workflows/i1-resolve-rust-deps.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve candidate lock graph, read-only
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          sed -i 's/rusqlite = { version = "0.40.1"/rusqlite = { version = "0.41.1"/' Cargo.toml
          sed -i 's/zbus = { version = "6.0.0"/zbus = { version = "6.2.1"/' Cargo.toml
          grep -F 'rusqlite = { version = "0.41.1"' Cargo.toml
          grep -F 'zbus = { version = "6.2.1"' Cargo.toml
          cargo update
          cargo update -p rusqlite --precise 0.41.1
          cargo update -p libsqlite3-sys --precise 0.39.1
          cargo update -p zbus --precise 6.2.1
          cargo metadata --locked --format-version=1 > /tmp/i1-metadata.json
          cargo tree --locked --target all -e all > /tmp/i1-tree.txt
          echo 'I1_CARGO_LOCK_BASE64_START'
          base64 -w76 Cargo.lock
          echo 'I1_CARGO_LOCK_BASE64_END'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: i1-resolution-report
          path: |
            /tmp/i1-metadata.json
            /tmp/i1-tree.txt
          if-no-files-found: ignore
