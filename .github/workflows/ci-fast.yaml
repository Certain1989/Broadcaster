name: Fast CI

# Routine PR changes get immediate, inexpensive feedback without launching
# the exhaustive native and dual-architecture Flatpak matrix.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: "Fast / Rust + GTK + SQLite"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth python libxtst
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-container
      - name: Validate campaign-neutral executable names
        run: python3 tests/check_campaign_neutral_names.py
      - name: Configure
        run: meson setup _build -Dprofile=development
      - name: Check formatting
        run: cargo fmt --check
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Ordinary Rust tests
        run: cargo test --locked
      - name: Reject ambiguous or empty native-test selectors
        run: bash tests/test-ci-require-one-ignored.sh
      - name: Real GTK/SQLite/XTest canaries and negative-control marker
        run: bash tests/ci-fast-smoke.sh
      - name: Cold-process real GSettings scheduled LAN revocation and positive control
        run: |
          set -euo pipefail
          schema_dir="$(mktemp -d)"
          trap 'rm -rf "$schema_dir"' EXIT
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          BROADCASTER_NATIVE_CASE_TIMEOUT_SECONDS=120 \
            GSETTINGS_BACKEND=keyfile GSETTINGS_SCHEMA_DIR="$schema_dir" \
            bash tests/ci-require-one-ignored.sh real_keyfile_revocation_survives_process_restart_and_due_refresh
