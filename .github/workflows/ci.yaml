          trap 'rm -rf "$schema_dir"' EXIT
          for case_name in \
            focus_navigation_osk_native_grid_640_480 focus_navigation_osk_native_grid_1280_800 \
            focus_navigation_osk_native_paint_640_480 focus_navigation_osk_native_paint_1280_800 \
            focus_navigation_osk_native_persist_qwertz_restart \
            native_source_refresh_one_640_480 native_source_refresh_three_1280_800 \
            native_source_file_chooser_640_480 native_source_file_chooser_1280_800 \
            native_guide_add_url_640_480 native_guide_add_url_1280_800 \
            native_guide_refresh_640_480 native_guide_refresh_1280_800 \
            native_guide_local_chooser_640_480 native_guide_local_chooser_1280_800 \
            native_guide_manager_paint_640_480 native_guide_manager_paint_1280_800 \
            native_picker_osk_paint_640_480 native_picker_osk_paint_1280_800 \
            native_nested_guide_osk_640_480 native_nested_guide_osk_1280_800 \
            native_app_menu_640_480 native_app_menu_1280_800 \
            native_mediathek_loaded_vertical_640_480 native_mediathek_loaded_vertical_1280_800 \
            native_recycle_removed_source_640_480 native_recycle_removed_source_1280_800 \
            native_manager_paint_upper_640_480 native_manager_paint_upper_1280_800 \
            native_manager_paint_lower_640_480 native_manager_paint_lower_1280_800 \
            native_manager_paint_confirm_640_480 native_manager_paint_confirm_1280_800 \
            native_live_player_failure_640_480 native_live_player_failure_1280_800 \
            native_mediathek_paged_640_480 native_mediathek_paged_1280_800 \
            native_mediathek_retry_640_480 native_mediathek_retry_1280_800 \
            native_fake_fullscreen_cancel_640_480 native_fake_fullscreen_cancel_1280_800 \
            native_three_page_loaded_640_480 native_three_page_loaded_1280_800 \
            native_picker_guide_removed_640_480 native_picker_guide_removed_1280_800 \
            native_picker_source_refreshed_640_480 native_picker_source_refreshed_1280_800 \
            native_scale_284 native_scale_1484 native_scale_10000 native_scale_15000; do
            case "$case_name" in
              *_1280_800|native_scale_1484|native_scale_15000) geometry=1280x800 ;;
              *) geometry=640x480 ;;
            esac
            data_dir=$(mktemp -d -t broadcaster-guide-mapping-fixture-focus-navigation-XXXXXXXX)
            echo "NATIVE_FOCUS native positive: $case_name ($geometry)"
            xvfb-run -a -s "-screen 0 ${geometry}x24" \
              env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" \
              XDG_DATA_HOME="$data_dir" \
              bash tests/ci-require-one-ignored.sh "$case_name"
            rm -rf "$data_dir"
          done
          negative_log=$(mktemp)
          trap 'rm -rf "$schema_dir"; rm -f "$negative_log"' EXIT
          for item in \
            focus_navigation_osk_native_grid_negative_owner:NATIVE_FOCUS_OSK_EXPECTED_NEGATIVE_ORACLE \
            focus_navigation_osk_native_paint_negative:NATIVE_FOCUS_OSK_EXPECTED_NEGATIVE_PAINT \
            native_source_refresh_negative:NATIVE_FOCUS_SOURCE_REFRESH_PERSISTENCE_EXPECTED_NEGATIVE_ORACLE \
            native_source_file_chooser_negative:NATIVE_FOCUS_SOURCE_FILE_CHOOSER_EXPECTED_NEGATIVE_ORACLE \
            native_guide_add_url_negative:NATIVE_FOCUS_GUIDE_ADD_URL_EXPECTED_NEGATIVE_ORACLE \
            native_guide_refresh_negative:NATIVE_FOCUS_GUIDE_REFRESH_PERSISTENCE_EXPECTED_NEGATIVE_ORACLE \
            native_guide_local_chooser_negative:NATIVE_FOCUS_GUIDE_LOCAL_CHOOSER_EXPECTED_NEGATIVE_ORACLE \
            native_guide_manager_paint_negative:NATIVE_FOCUS_GUIDE_PICKER_PAINTED_FOCUS_EXPECTED_NEGATIVE_PAINT \
            native_picker_osk_paint_negative:NATIVE_FOCUS_GUIDE_PICKER_PAINTED_FOCUS_EXPECTED_NEGATIVE_PAINT \
            native_nested_guide_osk_negative:NATIVE_FOCUS_NESTED_GUIDE_OSK_EXPECTED_NEGATIVE_ORACLE \
            native_app_menu_negative:NATIVE_FOCUS_APPLICATION_MENU_EXPECTED_NEGATIVE_ORACLE \
            native_mediathek_loaded_vertical_negative:NATIVE_FOCUS_MEDIATHEK_ROW_NAVIGATION_EXPECTED_NEGATIVE_ORACLE \
            native_recycle_removed_source_negative:NATIVE_FOCUS_CHANNEL_REBIND_EXPECTED_NEGATIVE_ORACLE \
            native_manager_paint_negative:NATIVE_FOCUS_SOURCE_MANAGER_PAINTED_FOCUS_EXPECTED_NEGATIVE_PAINT \
            native_live_player_failure_negative:NATIVE_FOCUS_LIVE_PLAY_ENTRY_EXPECTED_NEGATIVE_ORACLE \
            native_mediathek_paged_negative:NATIVE_FOCUS_MEDIATHEK_PAGING_EXPECTED_NEGATIVE_ORACLE \
            native_mediathek_retry_negative:NATIVE_FOCUS_MEDIATHEK_RETRY_EXPECTED_NEGATIVE_ORACLE \
            native_fake_fullscreen_cancel_negative:NATIVE_FOCUS_FULLSCREEN_CANCEL_FOCUS_EXPECTED_NEGATIVE_ORACLE \
            native_three_page_loaded_negative:NATIVE_FOCUS_PAGE_SWITCHER_CONNECTED_EXPECTED_NEGATIVE \
            native_picker_guide_removed_negative:NATIVE_FOCUS_GUIDE_PICKER_EXPECTED_NEGATIVE_ORACLE \
            native_picker_source_refreshed_negative:NATIVE_FOCUS_GUIDE_PICKER_EXPECTED_NEGATIVE_ORACLE \
            native_scale_negative:NATIVE_FOCUS_SCALE_EXPECTED_NEGATIVE_ORACLE; do
            case_name=${item%%:*}
            marker=${item#*:}
            data_dir=$(mktemp -d -t broadcaster-guide-mapping-fixture-focus-navigation-XXXXXXXX)
            if xvfb-run -a -s '-screen 0 640x480x24' \
              env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" \
              XDG_DATA_HOME="$data_dir" \
              cargo test --locked "$case_name" -- --ignored --test-threads=1 \
              >"$negative_log" 2>&1; then
              cat "$negative_log"
              echo "Unexpectedly accepted deliberately false $case_name" >&2
              exit 1
            fi
            if ! grep -Fq "$marker" "$negative_log"; then
              cat "$negative_log"
              echo "NATIVE_FOCUS $case_name failed for the wrong reason" >&2
              exit 1
            fi
            rm -rf "$data_dir"
          done
          echo 'NATIVE_FOCUS integrated native positives and marker-controlled negatives passed'


      - name: Native validation failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "CI_NATIVE_DIAGNOSTIC job=${{ github.job }}"
          df -h .
          free -h || true
          ps -eo pid,etime,stat,comm | head -n 40 || true


  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # Expose only a disposable, unused host SDK for cleanup inside the
      # job container. GitHub-hosted runners install this SDK by default.
      volumes:
        - /usr/local/lib/android:/unused-runner-android
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim unused Android SDK on x86-64 runner
        if: matrix.variant.arch == 'x86_64'
        run: |
          echo 'Disk before cleanup:'
          df -h .
          du -sh /unused-runner-android 2>/dev/null || true
          # The Android SDK is unrelated to GTK/Rust/Flatpak builds.
          rm -rf /unused-runner-android/*
          echo 'Disk after cleanup:'
          df -h .
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: broadcaster.flatpak
          manifest-path: build-aux/io.github.Certain1989.Broadcaster.Devel.json
          run-tests: true
          arch: ${{ matrix.variant.arch }}
          verbose: true
          # Checkpoint PR and manually dispatched builds remain downloadable;
          # main push builds do not duplicate already published release bundles.
          upload-artifact: ${{ github.event_name != 'push' }}
      - name: Probe packaged mpv 0.42 HTTP playback and forwarded headers
        run: |
          set -eu
          test -x flatpak_app/files/bin/mpv
          wrapper=$(mktemp)
          trap 'rm -f "$wrapper"' EXIT
          cat > "$wrapper" <<'SH'
          #!/bin/sh
          exec flatpak build --share=network flatpak_app mpv "$@"
          SH
          chmod +x "$wrapper"
          python3 -m unittest discover -s tests/player -p 'test_mpv_*.py'
          python3 tests/player/mpv_http_probe.py --mpv "$wrapper" --expect-version 0.42 --require-hls
          python3 tests/player/mpv_tls_probe.py --mpv "$wrapper" --expect-version 0.42
          python3 tests/player/mpv_luajit_probe.py --build-root flatpak_app --expect-version 0.42
      - name: Verify exported development desktop metadata and icon
        run: |
          app=io.github.Certain1989.Broadcaster.Devel
          root=flatpak_app/files/share
          test -f "$root/applications/$app.desktop"
          test -f "$root/metainfo/$app.metainfo.xml"
          test -f "$root/icons/hicolor/128x128/apps/$app.png"
          # Flatpak renamed the launcher. About uses a resource-only alias
          # instead of requesting the now-missing base-name launcher file.
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster.png"
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster-about.png"
          # Desktop still uses the exported .Devel icon name.
          grep -Fx "Icon=$app" "$root/applications/$app.desktop"
          test -f "$root/icons/hicolor/symbolic/apps/$app-symbolic.svg"
          test ! -e "$root/icons/hicolor/128x128/apps/$app.Devel.png"
      - name: Report Flatpak CI disk usage
        if: always()
        run: |
          df -h .
          du -sh repo flatpak_app .flatpak-builder 2>/dev/null || true
