name: Full CI

# Keep the exhaustive Rust/native, REUSE-adjacent and dual-architecture package
# gates available for integration and release checkpoints. Automatic PR
# feedback lives in ci-fast.yaml instead.
# To request an exact-PR-head full check before integration, mark the PR ready
# or add/reapply its full-ci label. Any other PR label also requests full CI
# because GitHub cannot filter pull_request.labeled by label name in `on`.
# workflow_dispatch is for manual branch validation; dispatch-only checks do
# NOT satisfy required PR status checks on GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Journal/documentation-only pushes must not cancel an expensive source build.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    types: [labeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: "Rust (fmt, clippy)"
    timeout-minutes: 100
    env:
      BROADCASTER_NATIVE_CASE_TIMEOUT_SECONDS: "900"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth python libxtst
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cache only Rust job compiler artifacts, not Flatpak build trees.
      # rust-cache includes rustc version and Cargo.lock in its cache keys.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-container
      # Configure Rust values in the Meson build tree; Cargo's build.rs stages resources in OUT_DIR.
      - name: Configure
        run: meson setup _build -Dprofile=development
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Verify exact native-test selection (prefix and zero-match negatives)
        run: bash tests/test-ci-require-one-ignored.sh
      - name: NATIVE_FOCUS native painted X11 focus pixels and suppressed-control oracle
        run: |
          set -eu
          schema_dir=$(mktemp -d)
          negative_log=$(mktemp)
          trap 'rm -rf "$schema_dir"; rm -f "$negative_log"' EXIT
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          for case_name in native_painted_focus_640_480 native_painted_focus_1280_800; do
            case "$case_name" in
              *_640_480) geometry=640x480 ;;
              *) geometry=1280x800 ;;
            esac
            data_dir=$(mktemp -d -t broadcaster-focus-navigation-pixels-XXXXXXXX)
            xvfb-run -a -s "-screen 0 ${geometry}x24" \
              env GDK_BACKEND=x11 GDK_SCALE=1 GTK_ENABLE_ANIMATIONS=0 \
              GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" \
              XDG_DATA_HOME="$data_dir" \
              bash tests/ci-require-one-ignored.sh "$case_name"
            rm -rf "$data_dir"
          done
          if xvfb-run -a -s "-screen 0 640x480x24" \
            env GDK_BACKEND=x11 GDK_SCALE=1 GTK_ENABLE_ANIMATIONS=0 \
            GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" \
            cargo test --locked native_painted_focus_negative_pixels -- --ignored --test-threads=1 \
            >"$negative_log" 2>&1; then
            cat "$negative_log"
            echo "NATIVE_FOCUS painted negative oracle unexpectedly passed" >&2
            exit 1
          fi
          if ! grep -Fq NATIVE_FOCUS_PAINTED_FOCUS_EXPECTED_NEGATIVE_ORACLE "$negative_log"; then
            cat "$negative_log"
            echo "NATIVE_FOCUS painted negative oracle failed for unrelated reason" >&2
            exit 1
          fi
          echo "NATIVE_FOCUS real X11 pixel negative-control assertion rejected as expected"

