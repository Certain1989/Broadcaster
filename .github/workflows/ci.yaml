name: CI

# Full CI runs only at integrated source checkpoints, not intermediate staging commits.
# With checkpoint-only pushes, superseded full runs may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Journal/documentation-only pushes must not cancel an expensive source build.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  rust:
    name: "Rust (fmt, clippy)"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth libxtst libx11 python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cache only Rust job compiler artifacts, not Flatpak build trees.
      # rust-cache includes rustc version and Cargo.lock in its cache keys.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-container
      # Configure Rust values in the Meson build tree; Cargo's build.rs stages resources in OUT_DIR.
      - name: Configure
        run: meson setup _build -Dprofile=development
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      # Connected native X11 acceptance: deliberately blocked on missing test IDs,
      # failed XTest/GTK delivery, product assertions, or per-case timeout.
      # Existing Rust compile/test artifacts are reused in the same job.
      - name: Connected C3 remote-key XTest acceptance (640 and 1280)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir -p "$scratch/schema"
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$scratch/schema/"
          glib-compile-schemas "$scratch/schema"
          echo "C3_NATIVE checkout_HEAD=$(git rev-parse HEAD) checkout_TREE=$(git rev-parse HEAD^{tree})"
          echo "C3_NATIVE job_ref=${GITHUB_REF} branch_head=${GITHUB_HEAD_REF:-main}"
          cargo test --locked --no-run --message-format=json > "$scratch/cargo.jsonl"
          python3 - "$scratch/cargo.jsonl" "$scratch/test-bin" <<'PY_EXE'
          import json, os, sys
          artifacts = []
          for line in open(sys.argv[1], encoding='utf-8'):
              try:
                  obj = json.loads(line)
              except ValueError:
                  continue
              if obj.get('reason') != 'compiler-artifact':
                  continue
              target = obj.get('target') or {}
              if (target.get('name') == 'broadcaster'
                  and 'bin' in target.get('kind', [])
                  and (obj.get('profile') or {}).get('test')
                  and obj.get('executable')):
                  artifacts.append(obj['executable'])
          paths = sorted(set(artifacts))
          if len(paths) != 1 or not os.path.isfile(paths[0]) or not os.access(paths[0], os.X_OK):
              sys.exit('ENVIRONMENT: expected exactly one compiled broadcaster test executable, found %r' % paths)
          open(sys.argv[2], 'w', encoding='utf-8').write(paths[0] + '\n')
          print('C3_NATIVE test_executable=validated count=1')
          PY_EXE
          test_bin=$(cat "$scratch/test-bin")
          "$test_bin" --list --ignored > "$scratch/test-list"
          case_ids=(
            live::view::c3_native_live_tests::gtk_c3_xtest_live_first_middle_last
            live::view::c3_native_live_tests::gtk_c3_xtest_live_first_ok_focus_no_play
            live::view::c3_native_live_tests::gtk_c3_xtest_live_second_ok_exactly_once
            live::view::c3_native_live_tests::gtk_c3_xtest_live_right_left_back_after_rebind
            live::view::c3_native_live_tests::gtk_c3_xtest_negative_wrong_arrow_rejected
            mediathek::view::c3_native_mediathek_tests::gtk_c3_xtest_mediathek_compact_tv_roundtrip
          )
          for id in "${case_ids[@]}"; do
            count=$(grep -Fxc "$id: test" "$scratch/test-list" || true)
            if [ "$count" != 1 ]; then
              echo "ENVIRONMENT: missing/ambiguous C3 native case $id count=$count" >&2
              exit 2
            fi
          done
          for viewport in 640x480 1280x800; do
            for id in "${case_ids[@]}"; do
              mkdir -p "$scratch/$viewport/config" "$scratch/$viewport/data" "$scratch/$viewport/cache"
              echo "C3_NATIVE START id=$id viewport=$viewport"
              # A standalone process and display for every GTK test. No real
              # playlist/guide, player, device, or screenshot artifact used.
              timeout -k 5s 120s dbus-run-session -- xvfb-run -a \
                -s "-screen 0 ${viewport}x24 -ac +extension XTEST" \
                env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory \
                GSETTINGS_SCHEMA_DIR="$scratch/schema" \
                XDG_CONFIG_HOME="$scratch/$viewport/config" \
                XDG_DATA_HOME="$scratch/$viewport/data" \
                XDG_CACHE_HOME="$scratch/$viewport/cache" \
                BROADCASTER_C3_VIEWPORT="$viewport" \
                "$test_bin" "$id" --exact --ignored --nocapture --test-threads=1
              echo "C3_NATIVE PASS id=$id viewport=$viewport"
            done
          done
          echo 'C3_NATIVE RESULT all 12 connected viewport/case executions PASS; painted-focus ROI NOT_AUTOMATED (owner G09 pending)'
      - name: Exercise external-player D-Bus discovery on an isolated session bus
        run: dbus-run-session -- cargo test --locked dbus_proxy_lists_activatable_names -- --ignored --test-threads=1
      # Tests icon-name lookup on a *live* GDK display; file existence or PNG
      # decoding alone would have missed the N100 About placeholder.
      - name: Verify About icon theme lookup under a live display
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked icon_theme_resolves_about_icon_on_open_display -- --ignored --test-threads=1
      - name: Verify live-channel GTK activation with an actual ListBox
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_row_activation_expands_then_plays_exactly_once -- --ignored --test-threads=1
      - name: Verify list-boundary GTK child widget ancestry
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_focus_boundary_distinguishes_first_and_interior_rows -- --ignored --test-threads=1
      - name: Exercise Mediathek remote focus across filters, results and expanded cards
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_tv_remote_vertical_focus_follows_all_filters -- --ignored --test-threads=1
      - name: Verify real playback-view restoration and cold-start routing in GTK
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_playback_window_origin_and_cold_start -- --ignored --test-threads=1
      - name: Verify isolated first-launch fullscreen settings
        run: bash tests/first-launch-fullscreen.sh
      - name: Exercise MPV remote overlay state transitions
        run: |
          LC_ALL=C lua tests/mpv-remote.lua
          LC_ALL=de_DE.UTF-8 lua tests/mpv-remote.lua
          LC_ALL=fr_FR.UTF-8 lua tests/mpv-remote.lua
      - name: Native Meson compile and validation
        run: |
          meson compile -C _build
          meson test -C _build --print-errorlogs
      - name: Verify staged native installation
        run: |
          DESTDIR="$PWD/_build/install-root" meson install -C _build --no-rebuild
          test -x _build/install-root/usr/local/bin/broadcaster
          test -f _build/install-root/usr/local/share/glib-2.0/schemas/io.github.Certain1989.Broadcaster.gschema.xml
          test -f _build/install-root/usr/local/share/broadcaster/broadcaster-mpv-input.conf
          test -f _build/install-root/usr/local/share/broadcaster/broadcaster-mpv-remote.lua
          test -f _build/install-root/usr/local/share/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster.png
          grep -Fx 'Icon=io.github.Certain1989.Broadcaster' _build/install-root/usr/local/share/applications/io.github.Certain1989.Broadcaster.desktop
          test ! -f _build/install-root/usr/local/share/icons/hicolor/scalable/apps/io.github.Certain1989.Broadcaster.svg
      - name: Verify builds did not modify source checkout
        run: |
          test ! -e src/config.rs
          test ! -e data/resources/shortcuts-dialog.ui
          test ! -e data/resources/io.github.Certain1989.Broadcaster.metainfo.xml
          test -z "$(git status --porcelain --untracked-files=all)"

  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # Expose only a disposable, unused host SDK for cleanup inside the
      # job container. GitHub-hosted runners install this SDK by default.
      volumes:
        - /usr/local/lib/android:/unused-runner-android
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim unused Android SDK on x86-64 runner
        if: matrix.variant.arch == 'x86_64'
        run: |
          echo 'Disk before cleanup:'
          df -h .
          du -sh /unused-runner-android 2>/dev/null || true
          # The Android SDK is unrelated to GTK/Rust/Flatpak builds.
          rm -rf /unused-runner-android/*
          echo 'Disk after cleanup:'
          df -h .
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: broadcaster.flatpak
          manifest-path: build-aux/io.github.Certain1989.Broadcaster.Devel.json
          run-tests: true
          arch: ${{ matrix.variant.arch }}
          verbose: true
          # PR builds remain downloadable for manual testing; published releases
          # already provide installable bundles, so main push uploads are redundant.
          upload-artifact: ${{ github.event_name == 'pull_request' }}
      - name: Verify exported development desktop metadata and icon
        run: |
          app=io.github.Certain1989.Broadcaster.Devel
          root=flatpak_app/files/share
          test -f "$root/applications/$app.desktop"
          test -f "$root/metainfo/$app.metainfo.xml"
          test -f "$root/icons/hicolor/128x128/apps/$app.png"
          # Flatpak renamed the launcher. About uses a resource-only alias
          # instead of requesting the now-missing base-name launcher file.
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster.png"
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster-about.png"
          # Desktop still uses the exported .Devel icon name.
          grep -Fx "Icon=$app" "$root/applications/$app.desktop"
          test -f "$root/icons/hicolor/symbolic/apps/$app-symbolic.svg"
          test ! -e "$root/icons/hicolor/128x128/apps/$app.Devel.png"
      - name: Report Flatpak CI disk usage
        if: always()
        run: |
          df -h .
          du -sh repo flatpak_app .flatpak-builder 2>/dev/null || true