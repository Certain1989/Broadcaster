name: CI

# Full CI runs only at integrated source checkpoints, not intermediate staging commits.
# With checkpoint-only pushes, superseded full runs may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Journal/documentation-only pushes must not cancel an expensive source build.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  rust:
    name: "Rust (fmt, clippy)"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cache only Rust job compiler artifacts, not Flatpak build trees.
      # rust-cache includes rustc version and Cargo.lock in its cache keys.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-container
      # Configure Rust values in the Meson build tree; Cargo's build.rs stages resources in OUT_DIR.
      - name: Configure
        run: meson setup _build -Dprofile=development
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Exercise external-player D-Bus discovery on an isolated session bus
        run: dbus-run-session -- cargo test --locked dbus_proxy_lists_activatable_names -- --ignored --test-threads=1
      # Tests icon-name lookup on a *live* GDK display; file existence or PNG
      # decoding alone would have missed the N100 About placeholder.
      - name: Verify About icon theme lookup under a live display
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked icon_theme_resolves_about_icon_on_open_display -- --ignored --test-threads=1
      - name: Verify live-channel GTK activation with an actual ListBox
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_row_activation_expands_then_plays_exactly_once -- --ignored --test-threads=1
      - name: Verify list-boundary GTK child widget ancestry
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_focus_boundary_distinguishes_first_and_interior_rows -- --ignored --test-threads=1
      - name: Exercise Mediathek remote focus across filters, results and expanded cards
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_tv_remote_vertical_focus_follows_all_filters -- --ignored --test-threads=1
      - name: Verify real playback-view restoration and cold-start routing in GTK
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_playback_window_origin_and_cold_start -- --ignored --test-threads=1
      - name: Block PR on mapped GTK remote focus regression suite
        run: bash tests/focus/run-mapped.sh
      - name: Verify isolated first-launch fullscreen settings
        run: bash tests/first-launch-fullscreen.sh
      - name: Exercise MPV remote overlay state transitions
        run: |
          LC_ALL=C lua tests/mpv-remote.lua
          LC_ALL=de_DE.UTF-8 lua tests/mpv-remote.lua
          LC_ALL=fr_FR.UTF-8 lua tests/mpv-remote.lua
      - name: Native Meson compile and validation
        run: |
          meson compile -C _build
          meson test -C _build --print-errorlogs
      - name: Verify staged native installation
        run: |
          DESTDIR="$PWD/_build/install-root" meson install -C _build --no-rebuild
          test -x _build/install-root/usr/local/bin/broadcaster
          test -f _build/install-root/usr/local/share/glib-2.0/schemas/io.github.Certain1989.Broadcaster.gschema.xml
          test -f _build/install-root/usr/local/share/broadcaster/broadcaster-mpv-input.conf
          test -f _build/install-root/usr/local/share/broadcaster/broadcaster-mpv-remote.lua
          test -f _build/install-root/usr/local/share/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster.png
          grep -Fx 'Icon=io.github.Certain1989.Broadcaster' _build/install-root/usr/local/share/applications/io.github.Certain1989.Broadcaster.desktop
          test ! -f _build/install-root/usr/local/share/icons/hicolor/scalable/apps/io.github.Certain1989.Broadcaster.svg
      - name: Verify builds did not modify source checkout
        run: |
          test ! -e src/config.rs
          test ! -e data/resources/shortcuts-dialog.ui
          test ! -e data/resources/io.github.Certain1989.Broadcaster.metainfo.xml
          test -z "$(git -c safe.directory="$PWD" status --porcelain --untracked-files=all)"


  # Exploratory only: this job must never replace or soften rust's blocking
  # mapped-focus gate, security/reuse, or the required Flatpak jobs.
  focus_pilot:
    name: "Diagnostic FOCUS-001 reusable-binary pilot (NOT acceptance)"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install existing GTK toolchain and XTest compiler headers
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth libxtst libx11 python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Diagnostic artefacts must identify the actual PR head, never a
          # synthetic pull_request merge SHA or another worker's build.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure, compile once, fingerprint exact published source binary
        env:
          PILOT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focus-pilot-artifacts
          meson setup _build -Dprofile=development
          cargo test --locked --no-run --message-format=json > focus-pilot-artifacts/compiler.jsonl
          python - <<'PY'
          import json, pathlib, subprocess, os, hashlib
          required={
              'gtk_focus001_xtest_mediathek_middle_card_ok_primary_play',
              'gtk_focus001_xtest_live_search_down_native_propagation',
              'gtk_focus001_negative_control_detects_stolen_focus',
          }
          binaries=set()
          for line in pathlib.Path('focus-pilot-artifacts/compiler.jsonl').read_text().splitlines():
              try: obj=json.loads(line)
              except ValueError: continue
              exe=obj.get('executable')
              if obj.get('reason')=='compiler-artifact' and exe and pathlib.Path(exe).is_file():
                  binaries.add(os.path.realpath(exe))
          matches=[]
          for exe in binaries:
              probe=subprocess.run([exe,'--list'],text=True,capture_output=True,timeout=20)
              if probe.returncode==0 and all(any(x.rsplit(': test',1)[0].split('::')[-1]==test for x in probe.stdout.splitlines() if x.endswith(': test')) for test in required):
                  matches.append(exe)
          if len(matches)!=1: raise SystemExit(f'FOCUS001 ENVIRONMENT unable to resolve exactly one test binary (matches={len(matches)})')
          exe=matches[0]
          fingerprint=hashlib.sha256(pathlib.Path(exe).read_bytes()).hexdigest()
          git=['git','-c','safe.directory='+str(pathlib.Path.cwd()),'rev-parse']
          sha=subprocess.check_output([*git,'HEAD'],text=True).strip()
          tree=subprocess.check_output([*git,'HEAD^{tree}'],text=True).strip()
          expected=os.environ['PILOT_EXPECTED_SHA']
          if sha != expected:
              raise SystemExit(f'FOCUS001 SOURCE_MISMATCH expected={expected} actual={sha}')
          pathlib.Path('focus-pilot-artifacts/test-binary-path.txt').write_text(exe+'\n')
          pathlib.Path('focus-pilot-artifacts/manifest.txt').write_text(f'source_sha={sha}\ntree={tree}\nbinary_sha256={fingerprint}\n')
          print('FOCUS001 PILOT source',sha,'tree',tree,'binary',fingerprint)
          PY
          pacman -Q > focus-pilot-artifacts/arch-packages.txt
          exe=$(cat focus-pilot-artifacts/test-binary-path.txt)
          tar -czf focus-pilot-artifacts/published-commit-test-binary.tar.gz -C "$(dirname "$exe")" "$(basename "$exe")"
          rm focus-pilot-artifacts/compiler.jsonl
      - name: Execute bounded XTest PASS, known RED, and negative controls
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cat focus-pilot-artifacts/test-binary-path.txt)
          mkdir -p focus-pilot-artifacts/observed focus-pilot-artifacts/environment
          set +e
          FOCUS001_TEST_BINARY="$exe" \
          FOCUS001_ONLY_CASES='gtk_focus001_xtest_mediathek_middle_card_ok_primary_play,gtk_focus001_xtest_live_search_down_native_propagation,gtk_focus001_negative_control_detects_stolen_focus' \
          FOCUS001_PILOT_RESULTS_DIR=focus-pilot-artifacts/observed \
            bash tests/focus/run-mapped.sh > focus-pilot-artifacts/observed-summary.txt 2>&1
          observed_rc=$?
          FOCUS001_CC=/intentionally-missing-compiler \
          FOCUS001_TEST_BINARY="$exe" \
          FOCUS001_ONLY_CASES='gtk_focus001_xtest_live_search_down_native_propagation' \
          FOCUS001_PILOT_RESULTS_DIR=focus-pilot-artifacts/environment \
            bash tests/focus/run-mapped.sh > focus-pilot-artifacts/environment-summary.txt 2>&1
          environment_rc=$?
          set -e
          printf 'observed_rc=%s\nenvironment_rc=%s\n' "$observed_rc" "$environment_rc" > focus-pilot-artifacts/exit-codes.txt
          python - "$observed_rc" "$environment_rc" <<'PY'
          import sys, pathlib, hashlib
          root=pathlib.Path('focus-pilot-artifacts')
          assert int(sys.argv[1])!=0 and int(sys.argv[2])!=0, 'negative inputs incorrectly succeeded'
          def verified(path):
              a=path.read_text().strip().split('\t')
              assert len(a)==8, (path,len(a))
              log=path.with_suffix('.log')
              assert hashlib.sha256(log.read_bytes()).hexdigest()==a[6], 'log fingerprint mismatch'
              assert a[3] and len(a[3])==40 and len(a[4])==40 and len(a[5])==64, 'source/binary fingerprint missing'
              return a[1]
          observed={p.stem: verified(p) for p in (root/'observed').glob('*.tsv')}
          env={p.stem: verified(p) for p in (root/'environment').glob('*.tsv')}
          expected={
              'gtk_focus001_xtest_mediathek_middle_card_ok_primary_play':'PASS',
              'gtk_focus001_xtest_live_search_down_native_propagation':'RED',
              'gtk_focus001_negative_control_detects_stolen_focus':'PASS',
          }
          print('FOCUS001 DIAGNOSTIC observed',observed,'environment',env)
          assert observed==expected, 'product RED, native PASS or focus-theft canary changed: investigate, no acceptance'
          assert env=={'gtk_focus001_xtest_live_search_down_native_propagation':'ENVIRONMENT'}, 'missing-XTest control misclassified'
          PY
      - name: Preserve bounded diagnostic artifacts even on nonzero
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus001-diagnostic-pilot-${{ github.event.pull_request.head.sha || github.sha }}
          path: focus-pilot-artifacts/
          retention-days: 7
          if-no-files-found: warn

  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # Expose only a disposable, unused host SDK for cleanup inside the
      # job container. GitHub-hosted runners install this SDK by default.
      volumes:
        - /usr/local/lib/android:/unused-runner-android
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim unused Android SDK on x86-64 runner
        if: matrix.variant.arch == 'x86_64'
        run: |
          echo 'Disk before cleanup:'
          df -h .
          du -sh /unused-runner-android 2>/dev/null || true
          # The Android SDK is unrelated to GTK/Rust/Flatpak builds.
          rm -rf /unused-runner-android/*
          echo 'Disk after cleanup:'
          df -h .
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: broadcaster.flatpak
          manifest-path: build-aux/io.github.Certain1989.Broadcaster.Devel.json
          run-tests: true
          arch: ${{ matrix.variant.arch }}
          verbose: true
          # PR builds remain downloadable for manual testing; published releases
          # already provide installable bundles, so main push uploads are redundant.
          upload-artifact: ${{ github.event_name == 'pull_request' }}
      - name: Verify exported development desktop metadata and icon
        run: |
          app=io.github.Certain1989.Broadcaster.Devel
          root=flatpak_app/files/share
          test -f "$root/applications/$app.desktop"
          test -f "$root/metainfo/$app.metainfo.xml"
          test -f "$root/icons/hicolor/128x128/apps/$app.png"
          # Flatpak renamed the launcher. About uses a resource-only alias
          # instead of requesting the now-missing base-name launcher file.
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster.png"
          test ! -e "$root/icons/hicolor/128x128/apps/io.github.Certain1989.Broadcaster-about.png"
          # Desktop still uses the exported .Devel icon name.
          grep -Fx "Icon=$app" "$root/applications/$app.desktop"
          test -f "$root/icons/hicolor/symbolic/apps/$app-symbolic.svg"
          test ! -e "$root/icons/hicolor/128x128/apps/$app.Devel.png"
      - name: Report Flatpak CI disk usage
        if: always()
        run: |
          df -h .
          du -sh repo flatpak_app .flatpak-builder 2>/dev/null || true