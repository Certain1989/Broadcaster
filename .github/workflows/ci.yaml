          if ! grep -Fq R07_EXPECTED_NEGATIVE_ORACLE "$negative_log"; then
            cat "$negative_log"
            echo "R07 negative oracle failed for the wrong reason" >&2
            exit 1
          fi
          echo "R07 deliberately wrong persisted source identity was rejected"

