name: Signed Flatpak importer differential (nonproduction)

on:
  pull_request:
    paths:
      - '.github/workflows/signed-flatpak-importer-diagnostic.yaml'

permissions:
  contents: read
  actions: read

concurrency:
  group: importer-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Disposable, read-only past proof bundles; no release, hosted remote or key upload.
jobs:
  importer-ubuntu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu Flatpak import tools
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree gnupg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "DIAG_SOURCE=$EXPECTED_SOURCE_SHA"
      - name: Download pinned successful native proof bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: 41721108712
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: signed-remote-bundle-*
          merge-multiple: true
          path: dist
      - name: Compare four SHA-256-identical bundles (unsigned/signed importer)
        env:
          LANG: C
          LC_ALL: C
        run: |
          set -euo pipefail
          umask 077
          echo "DIAG_STACK flatpak=$(flatpak --version)"
          ostree --version
          for pkg in ostree-1 glib-2.0; do
            if command -v pkg-config >/dev/null; then
              echo "DIAG_LIBRARY $pkg=$(pkg-config --modversion "$pkg" 2>/dev/null || echo unavailable)"
            fi
          done
          if command -v dpkg-query >/dev/null; then
            dpkg-query -W -f='DIAG_DEB $(binary:Package)=$(Version)\n' flatpak libostree-1-1 libglib2.0-0t64 libglib2.0-0 2>/dev/null || true
          fi
          if command -v rpm >/dev/null; then rpm -q flatpak ostree-libs glib2 || true; fi
          case "$(flatpak --version)" in
            "Flatpak 1.14."*) ;;
            *) echo "DIAG_FAILURE: installed Flatpak version outside requested family" >&2; exit 1 ;;
          esac
          cat <<'BUNDLE_SHA256' | sha256sum -c -
          afd33223d831fde806aed308888b881321a12aa7d9c945d37a1d7d9d2ec5c3f8  dist/broadcaster-signed-remote-x86_64.flatpak
          dbd69be951296414b87e90fe4accffd9ba2ce9f881b02b0ae9a3b27d4cb85fa2  dist/broadcaster-signed-remote-aarch64.flatpak
          f737f9844dbd520ac3da8a66daeb12f82707bff3f8f2c72b97344108e91678e8  dist/broadcaster-signed-remote-v2-x86_64.flatpak
          911f4081f90352d03212ebe44b2e96b9c7e2fc4024848b09975975d28f55ec51  dist/broadcaster-signed-remote-v2-aarch64.flatpak
          BUNDLE_SHA256
          root=$(mktemp -d "$RUNNER_TEMP/importer-diag.XXXXXXXX")
          trap 'rm -rf -- "$root"' EXIT
          bash build-aux/signed-remote/make-test-key.sh "$root/disposable-key" >/dev/null
          key=$(cat "$root/disposable-key/.signed-remote-disposable-fingerprint")
          failures=0
          for mode in unsigned signed; do
            repo="$root/$mode/repo"
            mkdir -p "$root/$mode"
            ostree --repo="$repo" init --mode=archive-z2
            for name in broadcaster-signed-remote-x86_64.flatpak broadcaster-signed-remote-aarch64.flatpak broadcaster-signed-remote-v2-x86_64.flatpak broadcaster-signed-remote-v2-aarch64.flatpak; do
              case "$name" in *aarch64*) arch=aarch64;; *) arch=x86_64;; esac
              log="$root/$mode/$name.log"
              if [[ "$mode" == signed ]]; then
                if flatpak build-import-bundle --no-update-summary --gpg-sign="$key" \
                  --gpg-homedir="$root/disposable-key" "$repo" "dist/$name" >"$log" 2>&1; then rc=0; else rc=$?; fi
              else
                if flatpak build-import-bundle --no-update-summary "$repo" "dist/$name" >"$log" 2>&1; then rc=0; else rc=$?; fi
              fi
              crit=$(grep -Ec 'GLib-CRITICAL|OSTree-CRITICAL|GLib-GObject-CRITICAL' "$log" || true)
              echo "DIAG_IMPORT stack=1.14 mode=$mode bundle=$name rc=$rc criticals=$crit"
              if (( rc != 0 || crit != 0 )); then grep -E -C 1 'CRITICAL|WARNING|Error:|error:' "$log" | head -45 || true; fi
              ref="app/io.github.Certain1989.Broadcaster.Devel/$arch/master"
              if (( rc == 0 )) && sha=$(ostree --repo="$repo" rev-parse "$ref") && ostree --repo="$repo" show "$sha" >/dev/null; then
                echo "DIAG_REF mode=$mode ref=$ref sha=$sha"
              else
                failures=$((failures+1))
                echo "DIAG_FAILURE: ref absent/invalid $ref after $name" >&2
              fi
            done
            if ostree --repo="$repo" fsck >"$root/$mode/fsck.log" 2>&1; then
              echo "DIAG_FSCK mode=$mode PASS"
            else
              echo "DIAG_FSCK mode=$mode FAIL" >&2
              tail -25 "$root/$mode/fsck.log"
              failures=$((failures+1))
            fi
            if [[ "$mode" == signed ]]; then
              if flatpak build-update-repo --gpg-sign="$key" --gpg-homedir="$root/disposable-key" "$repo" >"$root/summarize.log" 2>&1 &&
                 test -s "$repo/summary" && test -s "$repo/summary.sig"; then
                echo "DIAG_SIGNED_SUMMARY PASS"
                find "$repo/summaries" -type f -name '*.idx.sig' -printf 'DIAG_SIGNED_INDEX %P\n' 2>/dev/null || true
              else
                echo "DIAG_SIGNED_SUMMARY FAIL" >&2
                cat "$root/summarize.log" || true
                failures=$((failures+1))
              fi
            fi
          done
          echo "DIAG_FINISHED stack=1.14 failures=$failures (criticals retained and reported)"
          (( failures == 0 ))

  importer-builder:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit source
        env:
