              echo "DIAG_LIBRARY $pkg=$(pkg-config --modversion "$pkg" 2>/dev/null || echo unavailable)"
            fi
          done
          if command -v dpkg-query >/dev/null; then
            dpkg-query -W -f='DIAG_DEB $(binary:Package)=$(Version)\n' flatpak libostree-1-1 libglib2.0-0t64 libglib2.0-0 2>/dev/null || true
          fi
          if command -v rpm >/dev/null; then rpm -q flatpak ostree-libs glib2 || true; fi
          case "$(flatpak --version)" in
            "Flatpak 1.18."*) ;;
            *) echo "DIAG_FAILURE: installed Flatpak version outside requested family" >&2; exit 1 ;;
          esac
          cat <<'BUNDLE_SHA256' | sha256sum -c -
          afd33223d831fde806aed308888b881321a12aa7d9c945d37a1d7d9d2ec5c3f8  dist/broadcaster-signed-remote-x86_64.flatpak
          dbd69be951296414b87e90fe4accffd9ba2ce9f881b02b0ae9a3b27d4cb85fa2  dist/broadcaster-signed-remote-aarch64.flatpak
          f737f9844dbd520ac3da8a66daeb12f82707bff3f8f2c72b97344108e91678e8  dist/broadcaster-signed-remote-v2-x86_64.flatpak
          911f4081f90352d03212ebe44b2e96b9c7e2fc4024848b09975975d28f55ec51  dist/broadcaster-signed-remote-v2-aarch64.flatpak
          BUNDLE_SHA256
          root=$(mktemp -d "$RUNNER_TEMP/importer-diag.XXXXXXXX")
          trap 'rm -rf -- "$root"' EXIT
