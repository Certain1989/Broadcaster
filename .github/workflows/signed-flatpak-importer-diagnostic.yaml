              echo "DIAG_IMPORT stack=1.18 mode=$mode bundle=$name rc=$rc criticals=$crit"
              if (( rc != 0 || crit != 0 )); then grep -E -C 1 'CRITICAL|WARNING|Error:|error:' "$log" | head -45 || true; fi
              ref="app/io.github.Certain1989.Broadcaster.Devel/$arch/master"
              if (( rc == 0 )) && sha=$(ostree --repo="$repo" rev-parse "$ref") && ostree --repo="$repo" show "$sha" >/dev/null; then
