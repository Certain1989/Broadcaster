name: Release

# A release PR produces installable, testable candidates without creating a
# GitHub release or tag. Only a later owner-created version tag may publish
# checked assets to a *draft* release.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-check:
    name: Release source verification
    # Only maintainer-controlled release PR branches may trigger expensive
    # candidate builds; write permissions are reserved for the tag job.
    if: github.event_name == 'push' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve and validate release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable version: $version" >&2; exit 1; }
          grep -Fx "  version: '$version'," meson.build
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            test -f "docs/release-v$version-notes.md"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure release profile
        run: meson setup _build -Dprofile=release
      - name: Rust formatting, Clippy and locked tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Live GTK About icon test
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked icon_theme_resolves_about_icon_on_open_display -- --ignored --test-threads=1
      - name: Verify live-channel GTK activation with an actual ListBox
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_row_activation_expands_then_plays_exactly_once -- --ignored --test-threads=1
      - name: Verify list-boundary GTK child widget ancestry
        run: xvfb-run -a env GDK_BACKEND=x11 cargo test --locked gtk_focus_boundary_distinguishes_first_and_interior_rows -- --ignored --test-threads=1
      - name: Exercise Mediathek focus route with GTK, filters and nested card actions
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_tv_remote_vertical_focus_follows_all_filters -- --ignored --test-threads=1
      - name: Verify real playback-view restoration and cold-start routing in GTK
        run: |
          schema_dir=$(mktemp -d)
          cp data/io.github.Certain1989.Broadcaster.gschema.xml "$schema_dir/"
          glib-compile-schemas "$schema_dir"
          xvfb-run -a env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR="$schema_dir" cargo test --locked gtk_playback_window_origin_and_cold_start -- --ignored --test-threads=1
      - name: Verify isolated first-launch fullscreen settings
        run: bash tests/first-launch-fullscreen.sh
      - name: mpv remote overlay tests
        run: |
          LC_ALL=C lua tests/mpv-remote.lua
          LC_ALL=de_DE.UTF-8 lua tests/mpv-remote.lua
          LC_ALL=fr_FR.UTF-8 lua tests/mpv-remote.lua
      - name: Compile, test and stage native release
        run: |
          meson compile -C _build
          meson test -C _build --print-errorlogs
          DESTDIR="$PWD/_build/install-root" meson install -C _build --no-rebuild
          root=_build/install-root/usr/local
          app=io.github.Certain1989.Broadcaster
          test -x "$root/bin/broadcaster"
          test -f "$root/share/glib-2.0/schemas/$app.gschema.xml"
          test -f "$root/share/broadcaster/broadcaster-mpv-input.conf"
          test -f "$root/share/broadcaster/broadcaster-mpv-remote.lua"
          test -f "$root/share/icons/hicolor/128x128/apps/$app.png"
          test -f "$root/share/icons/hicolor/symbolic/apps/$app-symbolic.svg"
          test -f "$root/share/metainfo/$app.metainfo.xml"
          grep -Fx "Icon=$app" "$root/share/applications/$app.desktop"
          grep -F "<id>$app</id>" "$root/share/metainfo/$app.metainfo.xml"
      - name: Confirm build left tracked source unchanged
        run: test -z "$(git status --porcelain --untracked-files=all)"

  reuse:
    name: Release REUSE compliance
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  flatpak:
    name: Production Flatpak (${{ matrix.variant.arch }})
    needs: [source-check, reuse]
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
      volumes:
        - /usr/local/lib/android:/unused-runner-android
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim unused Android SDK on x86-64 runner
        if: matrix.variant.arch == 'x86_64'
        run: |
          df -h .
          rm -rf /unused-runner-android/*
          df -h .
      - name: Build production Flatpak bundle with packaged tests
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: build-aux/io.github.Certain1989.Broadcaster.json
          bundle: broadcaster-${{ needs.source-check.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          run-tests: true
          verbose: true
          upload-artifact: false
      - name: Verify exported production identity, assets and bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          app=io.github.Certain1989.Broadcaster
          arch=${{ matrix.variant.arch }}
          bundle="broadcaster-${{ needs.source-check.outputs.version }}-$arch.flatpak"
          root=flatpak_app/files
          share="$root/share"
          test -s "$bundle"
          test -x "$root/bin/broadcaster"
          test -f "$root/share/broadcaster/broadcaster-mpv-input.conf"
          test -f "$root/share/broadcaster/broadcaster-mpv-remote.lua"
          test -f "$share/glib-2.0/schemas/$app.gschema.xml"
          SCHEMA_DIR="$share/glib-2.0/schemas" bash tests/first-launch-fullscreen.sh
          test -f "$share/icons/hicolor/128x128/apps/$app.png"
          test -f "$share/icons/hicolor/symbolic/apps/$app-symbolic.svg"
          test -f "$share/applications/$app.desktop"
          test -f "$share/metainfo/$app.metainfo.xml"
          grep -Fx "Icon=$app" "$share/applications/$app.desktop"
          grep -F "<id>$app</id>" "$share/metainfo/$app.metainfo.xml"
          grep -Fx "name=$app" flatpak_app/metadata
          if find "$share/applications" "$share/metainfo" "$share/icons/hicolor" -name '*Devel*' | grep -q .; then
            echo 'Unexpected development identity in release export' >&2
            exit 1
          fi
          ostree --repo=imported-bundle-repo init --mode=archive-z2
          flatpak build-import-bundle imported-bundle-repo "$bundle"
          ostree --repo=imported-bundle-repo refs | grep -Fx "app/$app/$arch/master"
          sha256sum "$bundle"
      - name: Upload verified release candidate for this architecture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-flatpak-${{ matrix.variant.arch }}
          path: broadcaster-${{ needs.source-check.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Show disk usage
        if: always()
        run: |
          df -h .
          du -sh repo flatpak_app .flatpak-builder 2>/dev/null || true

  assemble:
    name: Verify assembled release artifacts
    needs: [source-check, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: production-flatpak-*
          path: dist
          merge-multiple: true
      - name: Require both architectures and generate final checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s broadcaster-${{ needs.source-check.outputs.version }}-x86_64.flatpak
          test -s broadcaster-${{ needs.source-check.outputs.version }}-aarch64.flatpak
          test "$(find . -maxdepth 1 -type f -name '*.flatpak' | wc -l)" -eq 2
          sha256sum broadcaster-${{ needs.source-check.outputs.version }}-x86_64.flatpak broadcaster-${{ needs.source-check.outputs.version }}-aarch64.flatpak > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload assembled and checksummed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broadcaster-release-${{ github.sha }}
          path: |
            dist/broadcaster-${{ needs.source-check.outputs.version }}-x86_64.flatpak
            dist/broadcaster-${{ needs.source-check.outputs.version }}-aarch64.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Attach verified assets to draft release
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'Certain1989/Broadcaster'
    needs: [assemble, source-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: broadcaster-release-${{ github.sha }}
          path: dist
      - name: Reverify final uploaded assets and matching tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v${{ needs.source-check.outputs.version }}"
          cd dist
          test "$(find . -maxdepth 1 -type f -name '*.flatpak' | wc -l)" -eq 2
          sha256sum -c SHA256SUMS
      - name: Create draft with verified installable assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Broadcaster ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: docs/release-${{ github.ref_name }}-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/broadcaster-${{ needs.source-check.outputs.version }}-x86_64.flatpak
            dist/broadcaster-${{ needs.source-check.outputs.version }}-aarch64.flatpak
            dist/SHA256SUMS
