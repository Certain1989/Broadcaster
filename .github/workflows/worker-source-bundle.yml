name: Worker source bundle

# Public source transport only. Does not test application code or authorise integration.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional full 40-hex Broadcaster commit SHA to export'
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  export-source:
    # Comments can only request exports via issue #56, by the repository owner.
    # All other comments skip the job before any checkout or runner work.
    if: >-
      ${{ github.event_name != 'issue_comment' ||
          (github.event.issue.number == 56 &&
           !github.event.issue.pull_request &&
           github.event.comment.user.login == github.repository_owner &&
           startsWith(github.event.comment.body, '/source-bundle ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete public source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test source request authentication and parsing
        shell: bash
        run: bash .github/scripts/test-worker-source-request.sh

      - name: Create self-contained exact-commit Git bundle
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(bash .github/scripts/worker-source-request.sh "$EVENT_NAME" "$GITHUB_EVENT_PATH" "$REQUESTED_SHA" "$PUSH_SHA")"
          # Exact full commit only; never interpolate comment text into shell commands.
          git fetch --no-tags origin "$sha"
          [[ "$(git cat-file -t "$sha")" == commit ]] || exit 1
          git update-ref refs/heads/worker-source-export "$sha"
          mkdir -p export
          git bundle create export/broadcaster-source.bundle refs/heads/worker-source-export
          printf '%s\n' "$sha" > export/SOURCE_SHA
          git rev-parse "$sha^{tree}" > export/SOURCE_TREE
          (cd export && sha256sum broadcaster-source.bundle SOURCE_SHA SOURCE_TREE > SHA256SUMS)
          git init -q --bare "$RUNNER_TEMP/source-verify.git"
          git --git-dir="$RUNNER_TEMP/source-verify.git" bundle verify "$PWD/export/broadcaster-source.bundle"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload source transport artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broadcaster-source-${{ steps.source.outputs.sha }}
          path: export/
          if-no-files-found: error
          retention-days: 30
