name: Maintenance automation tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python syntax and offline positive/negative regression tests
        run: |
          python3 -m compileall -q tools/maintenance
          python3 -m unittest discover -s tools/maintenance -p 'test_*.py' -v
      - name: Validate Flatpak manifest and checker metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('build-aux/io.github.Certain1989.Broadcaster.json').read_text())
          modules = {module['name']: module for module in doc['modules']}
          for name in ('mpv', 'libass', 'libplacebo', 'blueprint-compiler'):
              source = modules[name]['sources'][0]
              assert source.get('x-checker-data', {}).get('type') == 'git', name
              assert len(source['commit']) == 40, name
          assert len(modules['luajit']['sources'][0]['commit']) == 40
          PY
