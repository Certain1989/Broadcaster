# Temporary read-only format transport; no repo write token or push.
name: I1 format source candidate (temporary)
on:
  push:
    branches:
      - work/post031-d1-i1-rust-sqlite-20261105
    paths:
      - .github/workflows/i1-format-candidate.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Canonical Rustfmt and formatted source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo fmt
          cargo fmt --check
          for path in src/streams/backup.rs src/streams/storage_tests.rs; do
            echo "I1_FORMAT_START: $path"
            base64 -w76 "$path"
            echo "I1_FORMAT_END: $path"
          done
