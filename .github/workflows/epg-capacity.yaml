name: EPG capacity diagnostics

# Synthetic-only diagnostics. No downloaded EPGs, secrets or write permissions.
# Separate from routine CI: never silently turns stress results into release gates.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/epg-capacity.yaml'
      - 'src/epg/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  importer-capacity:
    # Only execute repository-owned PR code. No fork head runs here.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: archlinux:latest
    steps:
      - name: Install build and measurement dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth time procps-ng
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-capacity
      - name: Record runner and toolchain envelope
        run: |
          uname -a
          rustc --version
          cargo --version
          free -h
          df -h .
      - name: Configure application build
        run: meson setup _build -Dprofile=development
      - name: Show formatter output for review without pushing from CI
        run: |
          cargo fmt --all
          git diff -- src/epg/ingest.rs src/epg/xmltv.rs src/epg/network.rs src/epg/service.rs src/epg/sources.rs src/epg/mod.rs src/streams/storage.rs
      - name: Compile opt-in Rust/SQLite diagnostics
        run: cargo test --locked --release --no-run
      - name: Benchmark fabricated DE-size gzip import into SQLite
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_de_synthetic -- --ignored --nocapture --test-threads=1
          df -h .
      - name: Verify bounded rejection of fabricated US-count gzip input
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_us_baseline_rejection -- --ignored --nocapture --test-threads=1
          df -h .
