name: EPG capacity diagnostics

# Synthetic-only diagnostics. No downloaded EPGs, secrets or write permissions.
# Opt-in after the initial capacity acceptance campaign. Dispatch core or
# import_capacity after changes to EPG import, SQLite capacity or limits.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Synthetic EPG capacity diagnostic suite'
        required: true
        type: choice
        default: core
        options:
          - core
          - import_capacity

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  importer-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: archlinux:latest
    steps:
      - name: Install build and measurement dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust dbus gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth time procps-ng
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: true
          cache-all-crates: false
          key: archlinux-capacity
      - name: Record runner and toolchain envelope
        run: |
          uname -a
          rustc --version
          cargo --version
          free -h
          df -h .
      - name: Configure application build
        run: meson setup _build -Dprofile=development
      - name: Compile opt-in Rust/SQLite diagnostics
        run: cargo test --locked --release --no-run
      - name: Measure O01 rowid TEMP footprint through the actual importer
        if: inputs.suite == 'core'
        timeout-minutes: 8
        run: |
          # Six 100/1k/10k synthetic cases, <=420s combined, no 25k+ stress.
          /usr/bin/time -v timeout --signal=TERM 420s cargo test --locked --release epg_capacity_o01_rowid_markers -- --ignored --nocapture --test-threads=1
          df -h .

      - name: Benchmark fabricated DE-size gzip import into SQLite
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_de_synthetic -- --ignored --nocapture --test-threads=1
          df -h .
      - name: Verify bounded rejection of fabricated US-count gzip input
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_us_baseline_rejection -- --ignored --nocapture --test-threads=1
          df -h .

      - name: Benchmark streamed DE-sized plain XMLTV
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_de_plain_streamed_success -- --ignored --nocapture --test-threads=1
          df -h .
      - name: Benchmark streamed US-sized gzip XMLTV
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_us_streamed_success -- --ignored --nocapture --test-threads=1
          df -h .
      - name: Benchmark streamed ten-country-shaped gzip XMLTV
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_combined_gzip_streamed_success -- --ignored --nocapture --test-threads=1
          df -h .
      - name: Benchmark streamed ten-country-shaped plain XMLTV
        if: inputs.suite == 'core'
        timeout-minutes: 12
        run: |
          /usr/bin/time -v timeout --signal=TERM 600s cargo test --locked --release epg_capacity_combined_plain_streamed_success -- --ignored --nocapture --test-threads=1
          df -h .
      - name: IMPORT_CAPACITY IMPORT_DURABILITY/SQLITE_TEMP_CAPACITY persistence, rollback and concurrency negative tests
        if: inputs.suite == 'import_capacity'
        timeout-minutes: 8
        run: |
          /usr/bin/time -v timeout --signal=TERM 420s cargo test --locked --release epg::ingest::tests -- --nocapture --test-threads=1
          /usr/bin/time -v timeout --signal=TERM 120s cargo test --locked --release epg::tests:: -- --nocapture --test-threads=1
      - name: IMPORT_CAPACITY exact SUPPORTED_FLOOR production-floor real XMLTV importer (15k/1.5m)
        if: inputs.suite == 'import_capacity'
        timeout-minutes: 17
        run: |
          /usr/bin/time -v timeout --signal=TERM 960s cargo test --locked --release epg_capacity_supported_floor_streamed -- --ignored --nocapture --test-threads=1
          df -h .
