# One-time resolver for a security dependency migration, removed before PR review.
name: Resolve patched programme sanitizer

on:
  push:
    branches: [security/patched-programme-markup]
    paths: [.github/workflows/resolve-programme-sanitizer.yml]

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'Certain1989/Broadcaster' && github.ref == 'refs/heads/security/patched-programme-markup'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install Rust build and security tools
        run: pacman -Syu --noconfirm --needed base-devel git rust cargo-audit gtk4 libadwaita blueprint-compiler meson gettext appstream lua xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Update dependency lockfile
        run: |
          cargo update
          cargo tree --locked -i ammonia
          if cargo tree --locked -i html2pango; then
            echo "::error::html2pango must be absent from the dependency tree"
            exit 1
          fi
          cargo fmt
          cargo fmt --check
      - name: Compile and run tests
        run: |
          meson setup _build -Dprofile=development
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          meson compile -C _build
          meson test -C _build --print-errorlogs
      - name: Audit actual dependency tree without ignores
        run: |
          cargo audit
      - name: Commit tested lockfile and formatting to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Certain1989/Broadcaster
          test "$GITHUB_REF" = refs/heads/security/patched-programme-markup
          cd "$GITHUB_WORKSPACE"
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" config user.name 'github-actions[bot]'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" add -- Cargo.lock src/programme_markup.rs src/live/view.rs src/main.rs
          if git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "Checked-in files already match the tested build."
            exit 0
          fi
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" commit -m 'build: lock patched programme sanitizer dependencies'
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" push origin HEAD:refs/heads/security/patched-programme-markup
