# Temporary branch-only audit; remove after result.
name: Temporary candidate RustSec audit

on:
  push:
    branches:
      - maintenance/dependency-refresh-20261123

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'Certain1989/Broadcaster' && github.ref == 'refs/heads/maintenance/dependency-refresh-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install RustSec scanner
        run: pacman -Syu --noconfirm --needed git cargo-audit ca-certificates
      - name: Audit the combined locked dependency graph
        run: cargo audit --deny warnings --file Cargo.lock
