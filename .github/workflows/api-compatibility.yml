name: Upstream API compatibility

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broadcaster-api-compatibility
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'Certain1989/Broadcaster'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Query public upstream APIs (bounded and read-only)
        id: probe
        continue-on-error: true
        run: python3 tools/maintenance/api_compat.py --output "$RUNNER_TEMP/api-results.json"
      - name: Deduplicate issues or clear recovered incidents
        if: always() && steps.probe.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/maintenance/issue_sync.py --results "$RUNNER_TEMP/api-results.json"
      - name: Preserve failing check status
        if: steps.probe.outcome == 'failure'
        run: exit 1
