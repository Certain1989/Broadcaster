[package]
name = "broadcaster"
version = "0.2.1"
edition = "2021"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
eyre = "0.6.14"
futures-util = "0.3.31"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_46", "blueprint"] }
ammonia = "4.2.4"
regex = "1"
indexmap = { version = "2.7.1", features = ["serde"] }
mediathekviewweb = { version = "0.5.0", default-features = false, features = ["native-tls"] }
phf = { version = "0.14.0", features = ["macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "native-tls", "system-proxy"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.138"
ring = "0.17.14"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "backup"] }
uuid = { version = "1.28.0", features = ["v4"] }
smart-default = "0.7.1"
time = { version = "0.3.37", features = ["parsing", "serde"] }
tokio = { version = "1.43.0", features = ["fs", "time", "rt-multi-thread", "macros", "sync", "net", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy"] }

[profile.dev.build-override]
opt-level = 3
